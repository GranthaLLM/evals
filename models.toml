# Keys come from the env var named here, then the key file.

[defaults]
base_url = "https://openrouter.ai/api/v1"
key_env = "OPENROUTER_API_KEY"
key_file = "~/.openrouter_key"

[[model]]
name = "gemma-4-31b"
id = "gemma-4-31b-it"
base_url = "https://generativelanguage.googleapis.com/v1beta/openai"
key_env = "GOOGLE_API_KEY"
key_file = "~/.google_key"
# Gemma 4 emits its reasoning inline, so the budget must cover it
min_tokens = 4000

[[model]]
name = "gemma-4-26b"
id = "gemma-4-26b-a4b-it"
base_url = "https://generativelanguage.googleapis.com/v1beta/openai"
key_env = "GOOGLE_API_KEY"
key_file = "~/.google_key"
# Gemma 4 emits its reasoning inline, so the budget must cover it
min_tokens = 4000

[[model]]
name = "gemma-3-27b"
id = "google/gemma-3-27b-it"

[[model]]
name = "qwen3.8-27b"
id = "qwen/qwen3.8-27b"
base_url = "https://api.groq.com/openai/v1"
key_env = "GROQ_API_KEY"
key_file = "~/.groq_key"
extra = { reasoning_effort = "none" }

[[model]]
name = "qwen3.5-9b"
id = "qwen/qwen3.5-9b"
extra = { reasoning = { enabled = false } }

# Sarvam-M's base model; Sarvam-M itself is not on OpenRouter
[[model]]
name = "mistral-small-3.2"
id = "mistralai/mistral-small-3.2-24b-instruct"

[[model]]
name = "sarvam-m"
id = "sarvamai/sarvam-m:featherless-ai"
base_url = "https://router.huggingface.co/v1"
key_env = "HF_TOKEN"
key_file = "~/.cache/huggingface/token"

[[model]]
name = "bodhan"
id = "indic-translate"
base_url = "https://api.bodhan.ai/v1"
key_env = "BODHAN_API_KEY"
key_file = "~/.bodhan_key_translate"
# server pins greedy decoding and rejects temperature and max_tokens
pinned = true
extra = { source_language_code = "sa", target_language_code = "en" }

[[model]]
name = "gpt-oss-120b"
id = "openai/gpt-oss-120b"
base_url = "https://api.groq.com/openai/v1"
key_env = "GROQ_API_KEY"
key_file = "~/.groq_key"
extra = { reasoning_effort = "low" }
# reasoning tokens count against max_tokens and starve short answers
min_tokens = 600

# served by vllm on the 3090, reached through ssh -L 8000:localhost:8000 <pc>
[[model]]
name = "mitra-qwen-9b"
id = "buddhist-nlp/mitra-qwen35-translate"
base_url = "http://localhost:8000/v1"
key_env = "LOCAL_KEY"
key_file = "~/.local_key"
extra = { chat_template_kwargs = { enable_thinking = false }, max_tokens = 200, stop = ["\n#", "# text ="] }
